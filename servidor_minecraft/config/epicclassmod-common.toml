
[general]
	#Whether to log the dirt block on common setup
	logDirtBlock = true
	#A magic number
	#Range: > 0
	magicNumber = 42
	#What you want the introduction message to be for the magic number
	magicNumberIntroduction = "The magic number is... "
	#A list of items to log on common setup.
	items = ["minecraft:iron_ingot"]

	[general.mobLevel]
		#Enable Mob Level system
		enabled = true

	[general.jobWeaponRestriction]
		#Enable class-weapon restriction (attack speed penalty)
		enabled = true

[leveling]
	#Player max level. Default: 75
	#Range: 1 ~ 1000
	maxLevel = 75

[mobTarget]
	#How the whitelist/blacklist is interpreted.
	#- WHITELIST: must match whitelist AND not match blacklist
	#- BLACKLIST: must NOT match blacklist (whitelist ignored)
	#Default: WHITELIST
	mode = "WHITELIST"
	#Which mobs are allowed to receive levels.
	#Patterns:
	#  - *            (all)
	#  - modid:*      (all entities in namespace)
	#  - modid:entity (exact)
	#Default: ["*"]
	whitelist = ["*"]
	#Which mobs are excluded...
	#Default excludes major bosses.
	blacklist = ["minecraft:warden", "minecraft:wither", "minecraft:ender_dragon", "cataclysm:ancient_remnant", "cataclysm:ender_guardian", "cataclysm:netherite_monstrosity", "cataclysm:maledictus", "cataclysm:ignis", "cataclysm:scylla", "irons_spellbooks:dead_king", "irons_spellbooks:dead_king_corpse", "block_factorys_bosses:infernal_dragon", "block_factorys_bosses:yeti", "block_factorys_bosses:sandworm", "block_factorys_bosses:underworld_knight", "dungeons_and_combat:sunleia"]

[statReset]
	#Item id required to reset allocated stats.
	#Example: minecraft:diamond, minecraft:emerald, epicclassmod:your_currency
	#If invalid, it will fallback to minecraft:diamond.
	item = "minecraft:diamond"
	#How many of the item are required.
	#0 = free.
	#Range: 0 ~ 999999
	cost = 20

